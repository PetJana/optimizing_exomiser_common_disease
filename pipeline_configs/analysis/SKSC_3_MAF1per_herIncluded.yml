## Exomiser v14.0.0 analysis — run "SKSC_3_MAF1per_herIncluded"
## Benchmarking run, Figure 2A label "KSD+, default settings":
##   - HPO: kidney stone-related terms (see ../hpo_terms_SKSC.tsv)
##   - inheritance-mode weighting on (omimPrioritiser)
##   - max. MAF 1% for dominant and homozygous recessive modes
##   - pathogenicity: REVEL, MVP, SpliceAI, AlphaMissense
## The VCF is passed per sample on the command line (see ../run_exomiser.sh).
---
analysis:
    genomeAssembly: hg19
    ped:
    proband:
    # HPO list exactly as used in the analysis (HP:0000843, HP:0002150 and HP:0003072 appear twice)
    hpoIds: ['HP:0000787', 'HP:0003072', 'HP:0002150', 'HP:0002901', 'HP:0000843', 'HP:0003165',
             'HP:0100511', 'HP:0031415', 'HP:0002748', 'HP:0000939', 'HP:0002749', 'HP:0004349', 'HP:0002917',
             'HP:0002148', 'HP:0003109', 'HP:0002905', 'HP:6000489', 'HP:0012404', 'HP:0012405', 'HP:0008672',
             'HP:0004724', 'HP:0012580', 'HP:0012637', 'HP:0004921', 'HP:0005567',
             'HP:0012607', 'HP:0033759', 'HP:0012609', 'HP:0000121', 'HP:0001941', 'HP:0032943']
    # maximum minor allele frequency (%) per mode of inheritance
    inheritanceModes: {
      AUTOSOMAL_DOMINANT: 1.0,
      AUTOSOMAL_RECESSIVE_HOM_ALT: 1.0,
      AUTOSOMAL_RECESSIVE_COMP_HET: 2.0,
      X_DOMINANT: 1.0,
      X_RECESSIVE_HOM_ALT: 1.0,
      X_RECESSIVE_COMP_HET: 2.0,
      MITOCHONDRIAL: 0.2
    }
    analysisMode: PASS_ONLY
    frequencySources: [
        UK10K,
        GNOMAD_E_AFR, GNOMAD_E_AMR, GNOMAD_E_EAS, GNOMAD_E_NFE, GNOMAD_E_SAS,
        GNOMAD_G_AFR, GNOMAD_G_AMR, GNOMAD_G_EAS, GNOMAD_G_NFE, GNOMAD_G_SAS
    ]
    pathogenicitySources: [REVEL, MVP, SPLICE_AI, ALPHA_MISSENSE]
    steps: [
        failedVariantFilter: {},
        variantEffectFilter: {
          remove: [
              FIVE_PRIME_UTR_EXON_VARIANT,
              FIVE_PRIME_UTR_INTRON_VARIANT,
              THREE_PRIME_UTR_EXON_VARIANT,
              THREE_PRIME_UTR_INTRON_VARIANT,
              NON_CODING_TRANSCRIPT_EXON_VARIANT,
              NON_CODING_TRANSCRIPT_INTRON_VARIANT,
              CODING_TRANSCRIPT_INTRON_VARIANT,
              UPSTREAM_GENE_VARIANT,
              DOWNSTREAM_GENE_VARIANT,
              INTERGENIC_VARIANT,
              REGULATORY_REGION_VARIANT
          ]
        },
        frequencyFilter: {maxFrequency: 2.0},
        pathogenicityFilter: {keepNonPathogenic: true},
        inheritanceFilter: {},
        omimPrioritiser: {},
        hiPhivePrioritiser: {}
    ]
outputOptions:
    outputContributingVariantsOnly: false
    numGenes: 0
    # relative to the directory Exomiser is run from (its install directory)
    outputDirectory: results/SKSC_3_MAF1per_herIncluded
    outputFormats: [HTML, JSON, TSV_GENE, TSV_VARIANT, VCF]
